:root{--v:#6d28d9;--vl:#7c3aed;--vp:#ede9fe;--vm:#c4b5fd;--g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g500:#6b7280;--g700:#374151;--g900:#111827;--gr:#059669;--grl:#d1fae5;--am:#d97706;--aml:#fef3c7;--rd:#dc2626;--rdl:#fee2e2;--bl:#2563eb;--bll:#dbeafe}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--g50);color:var(--g900)}
#root{display:flex;height:100vh;overflow:hidden}
.sb{width:240px;min-width:240px;background:var(--g900);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:20px 20px 16px;border-bottom:1px solid #1f2937}
.sb-brand{font-size:22px;font-weight:800;color:#fff}
.sb-sub{color:var(--vm);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-sec{padding:14px 20px 4px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#4b5563}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 20px;cursor:pointer;color:#9ca3af;font-size:13px;border-left:2px solid transparent;transition:all .15s}
.nav-item:hover{color:#fff;background:#1f2937}
.nav-item.active{color:#fff;background:#1f2937;border-left-color:var(--vl)}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--rd);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}
.sb-foot{padding:12px 16px;border-top:1px solid #1f2937}
.ipc-box{background:#1f2937;border-radius:8px;padding:8px 12px}
.ipc-label{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.06em}
.ipc-val{font-size:16px;font-weight:700;color:var(--vm);margin-top:1px}
.ipc-date{font-size:10px;color:#4b5563;margin-top:1px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid var(--g200);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar-title{font-size:17px;font-weight:600;flex-shrink:0}
.topbar-actions{display:flex;gap:8px;align-items:center}
.content{flex:1;overflow-y:auto;padding:20px 28px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--vl);color:#fff}.btn-primary:hover{background:var(--v)}
.btn-secondary{background:#fff;color:var(--g700);border:1px solid var(--g200)}.btn-secondary:hover{background:var(--g50)}
.btn-ghost{background:transparent;color:var(--g500);padding:5px 8px}.btn-ghost:hover{background:var(--g100)}
.btn-danger{background:var(--rdl);color:var(--rd);border:none}.btn-danger:hover{background:#fca5a5}
.btn-green{background:var(--grl);color:var(--gr);border:none}
.btn-sm{padding:4px 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:18px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;color:var(--g700)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat-card{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:16px}
.stat-label{font-size:10px;font-weight:500;color:var(--g500);text-transform:uppercase;letter-spacing:.06em}
.stat-value{font-size:26px;font-weight:700;margin:4px 0 2px}
.stat-sub{font-size:11px;color:var(--g500)}
.stat-card.violet{border-left:3px solid var(--vl)}
.stat-card.green{border-left:3px solid var(--gr)}
.stat-card.blue{border-left:3px solid var(--bl)}
.stat-card.amber{border-left:3px solid var(--am)}
.stat-card.red{border-left:3px solid var(--rd)}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:8px;border:1px solid}
.alert-item.red{background:var(--rdl);border-color:#fca5a5}
.alert-item.amber{background:var(--aml);border-color:#fcd34d}
.alert-item.blue{background:var(--bll);border-color:#93c5fd}
.alert-item.violet{background:var(--vp);border-color:var(--vm)}
.alert-item.green{background:var(--grl);border-color:#6ee7b7}
.alert-body{flex:1;min-width:0}
.alert-title{font-size:13px;font-weight:600}
.alert-desc{font-size:12px;color:var(--g700);margin-top:2px}
.alert-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.venc-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--g100)}
.venc-row:hover{background:var(--g50)}
.venc-row:last-child{border-bottom:none}
.dias-badge{display:inline-flex;align-items:center;justify-content:center;min-width:56px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.dias-badge.rojo{background:var(--rdl);color:var(--rd)}
.dias-badge.naranja{background:#ffedd5;color:#c2410c}
.dias-badge.amarillo{background:var(--aml);color:var(--am)}
.dias-badge.verde{background:var(--grl);color:var(--gr)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--g50);padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--g200);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--g100);vertical-align:middle}
tbody tr:hover{background:var(--g50)}
tbody tr:last-child td{border-bottom:none}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-galeria{background:var(--vp);color:var(--v)}
.badge-local{background:var(--bll);color:var(--bl)}
.badge-depto{background:var(--grl);color:var(--gr)}
.badge-deposito{background:#fef3c7;color:#92400e}
.badge-activo{background:var(--grl);color:var(--gr)}
.badge-por-vencer{background:var(--aml);color:var(--am)}
.badge-vencido{background:var(--rdl);color:var(--rd)}
.badge-pesos{background:var(--g100);color:var(--g700)}
.badge-usd{background:#d1fae5;color:#065f46}
.badge-pagado{background:var(--grl);color:var(--gr)}
.badge-pendiente{background:var(--aml);color:var(--am)}
.badge-vacio{background:#f3e8ff;color:#7e22ce}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--g200);background:#fff;color:var(--g500);transition:all .15s}
.filter-btn.active{background:var(--vl);color:#fff;border-color:var(--vl)}
.search-input{padding:6px 12px;border:1px solid var(--g200);border-radius:7px;font-size:13px;outline:none}
.search-input:focus{border-color:var(--vm)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;border-radius:12px 12px 0 0;z-index:1}
.modal-title{font-size:15px;font-weight:600}
.modal-body{padding:18px 22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--g200);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff;border-radius:0 0 12px 12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
label{font-size:12px;font-weight:500;color:var(--g700)}
input,select,textarea{padding:7px 10px;border:1px solid var(--g200);border-radius:6px;font-size:13px;font-family:inherit;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--vm);box-shadow:0 0 0 3px rgba(196,181,253,.15)}
textarea{resize:vertical;min-height:70px}
.wa-preview{background:#e7fdb5;border-radius:0 0 10px 10px;padding:14px 16px;font-size:13px;line-height:1.7;white-space:pre-wrap;border:1px solid #c8e57a;border-top:none}
.wa-header{background:#075e54;color:#fff;border-radius:10px 10px 0 0;padding:9px 14px;font-size:12px;font-weight:600}
.calc-box{background:var(--vp);border:1px solid var(--vm);border-radius:10px;padding:14px}
.calc-result{font-size:22px;font-weight:700;color:var(--v)}
.divider{height:1px;background:var(--g200);margin:12px 0}
.text-muted{color:var(--g500);font-size:12px}
.fw600{font-weight:600}
.mt8{margin-top:8px}
.empty{text-align:center;padding:40px 20px;color:var(--g500)}
.empty .icon{font-size:36px;margin-bottom:10px}
.empty .msg{font-size:14px;font-weight:500}
.config-section{margin-bottom:20px}
.config-section h3{font-size:13px;font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--g200)}
.toast-container{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .2s ease;pointer-events:auto}
.toast.success{background:var(--gr)}.toast.error{background:var(--rd)}.toast.info{background:var(--vl)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.pending-banner{background:#1e1b4b;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.pending-dot{width:8px;height:8px;border-radius:50%;background:#f87171;flex-shrink:0;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--g200);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--g500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab.active{color:var(--vl);border-bottom-color:var(--vl)}
.tab:hover{color:var(--g700)}
.pago-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--g100)}
.pago-row:last-child{border-bottom:none}
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--g100);font-size:13px}
.hist-row:last-child{border-bottom:none}
.hist-row:hover{background:var(--g50)}
.vacante-card{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:14px;position:relative}
.vacante-card:hover{border-color:var(--vm);box-shadow:0 2px 8px rgba(109,40,217,.08)}
.vacante-precio{font-size:15px;font-weight:700;color:var(--v)}
.gasto-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--g100);font-size:13px}
.section-title{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--g900)}

<script>(function(){

// ── HELPERS ───────────────────────────────────────────────────────────
function proxAumento(c){
  var base=c.inicio||c.ultimoAumento;
  if(!base||!c.periodo)return null;
  var h=new Date();h.setHours(0,0,0,0);
  var d=new Date(base+'T00:00:00'),iter=0;
  while(d<=h&&iter<200){d=new Date(d.getFullYear(),d.getMonth()+c.periodo,d.getDate());iter++;}
  return{fecha:d,dias:Math.round((d-h)/86400000)};
}
function getIPC(){try{var el=document.querySelector('.ipc-val');return el?parseFloat(el.textContent):3.7;}catch{return 3.7;}}
function getCfg(){try{return JSON.parse(localStorage.getItem('nvp_cfg')||'{}');}catch{return{};}}
function getContratos(){try{return JSON.parse(localStorage.getItem('nvp_c')||'[]');}catch{return[];}}
function fmtP(v){return v?'$ '+Number(v).toLocaleString('es-AR'):'—';}
function fmt(v,m){return m==='USD'?'USD '+Number(v).toLocaleString('es-AR'):'$ '+Number(v).toLocaleString('es-AR');}
function mesActual(){var d=new Date();return d.toLocaleDateString('es-AR',{month:'long',year:'numeric'}).replace(/^\w/,function(c){return c.toUpperCase();});}
function proxMesStr(){var d=new Date();d.setMonth(d.getMonth()+1);return d.toLocaleDateString('es-AR',{month:'long',year:'numeric'});}
function proxMesKey(){var d=new Date();d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,7);}
function nvC(c,ipc){
  if(c.tipoAumento==='FIJO')return Math.round(c.valor*(1+(c.porc||0)/100));
  if(c.tipoAumento==='VALOR')return c.valorPactado||c.valor;
  return Math.round(c.valor*(1+ipc*(c.periodo||1)/100));
}

// ── NÚMERO A LETRAS ───────────────────────────────────────────────────
function numLetras(n){
  n=Math.round(Math.abs(n));
  if(n===0)return'CERO PESOS';
  var u=['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISEIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE'];
  var d=['','','VEINTI','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  var c=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  function d2(x){if(x<=20)return u[x];var t=Math.floor(x/10),r=x%10;if(t===2&&r>0)return'VEINTI'+u[r];return d[t]+(r?' Y '+u[r]:'');}
  function d3(x){if(x===100)return'CIEN';var h=Math.floor(x/100),r=x%100;return c[h]+(r?' '+d2(r):'');}
  function grp(x){if(x<100)return d2(x);if(x<1000)return d3(x);var m=Math.floor(x/1000),r=x%1000;return(m===1?'MIL':d3(m)+' MIL')+(r?' '+d3(r):'');}
  var mill=Math.floor(n/1000000),resto=n%1000000,res='';
  if(mill>0){res=(mill===1?'UN MILLON':grp(mill)+' MILLONES');if(resto>0)res+=' ';}
  if(resto>0)res+=grp(resto);
  return res+' PESOS';
}

// ── RECIBO INQUILINO ──────────────────────────────────────────────────
function generarRecibo(c,ov){
  var ipc=getIPC(),cfg=getCfg();
  var agencia=cfg.agencia||'Nicolás Ventura Propiedades',matricula=cfg.matricula||'6811';
  var mes=mesActual();
  var a=proxAumento(c),tieneAum=a&&Math.abs(a.dias)<=35;
  var alq=tieneAum?nvC(c,ipc):c.valor;
  var mABL=ov&&ov.mABL!=null?ov.mABL:(c.montoABL||0);
  var mAYSA=ov&&ov.mAYSA!=null?ov.mAYSA:(c.montoAYSA||0);
  var mLuz=ov&&ov.mLuz!=null?ov.mLuz:(c.montoLuz||0);
  var nABL=c.nroABL||'',nAYSA=c.nroAYSA||'',nLuz=c.nroLuz||'';
  var tieneIVA=(c.tipo==='local'&&c.tieneIVA===true);
  var iva=tieneIVA?Math.round(alq*0.21):0;
  var ts=mABL+mAYSA+mLuz;
  var total=c.moneda==='ARS'?alq+iva+ts:ts;
  var fecha=new Date().toLocaleDateString('es-AR');
  var nro=String(Math.floor(Math.random()*9000)+1000);

  function bloque(copia){
    var filas=[];
    filas.push(['Alquiler '+mes,fmt(alq,c.moneda)]);
    if(iva)filas.push(['IVA (21%)',fmtP(iva)]);
    if(mLuz)filas.push(['Luz'+(nLuz?' — N° '+nLuz:''),fmtP(mLuz)]);
    if(mAYSA)filas.push(['AYSA'+(nAYSA?' — N° '+nAYSA:''),fmtP(mAYSA)]);
    if(mABL)filas.push(['ABL'+(nABL?' — N° '+nABL:''),fmtP(mABL)]);
    var fHTML=filas.map(function(r){return'<tr><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;font-size:13px;">'+r[0]+'</td><td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;font-size:13px;font-weight:600;text-align:right;">'+r[1]+'</td></tr>';}).join('');
    var totRow=c.moneda==='USD'
      ?'<tr style="background:#f0fdf4;"><td style="padding:9px 10px;font-weight:700;color:#065f46;">Servicios</td><td style="padding:9px 10px;font-weight:800;text-align:right;">'+fmtP(ts)+'</td></tr><tr style="background:#f0f9ff;"><td style="padding:9px 10px;font-weight:700;color:#075985;">Alquiler</td><td style="padding:9px 10px;font-weight:800;text-align:right;">'+fmt(alq,'USD')+'</td></tr>'
      :'<tr style="background:#f0fdf4;"><td style="padding:9px 10px;font-weight:700;font-size:15px;color:#065f46;">TOTAL</td><td style="padding:9px 10px;font-weight:800;font-size:15px;color:#065f46;text-align:right;">'+fmtP(total)+'</td></tr>';
    return'<div style="border:1.5px solid #d1d5db;border-radius:10px;padding:20px 24px;font-family:Arial,sans-serif;">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid #6d28d9;">'
      +'<div><div style="font-size:17px;font-weight:800;color:#6d28d9;">'+agencia+'</div><div style="font-size:11px;color:#6b7280;">Matrícula CUCICBA N° '+matricula+'</div></div>'
      +'<div style="text-align:right;"><div style="font-size:11px;color:#9ca3af;">Recibo N°</div><div style="font-size:15px;font-weight:700;">'+nro+(copia==='inquilino'?'-A':'-B')+'</div><div style="font-size:11px;color:#9ca3af;">'+fecha+'</div></div></div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">'
      +'<div><div style="font-size:10px;text-transform:uppercase;color:#9ca3af;font-weight:600;">Propiedad</div><div style="font-size:13px;font-weight:600;margin-top:3px;">'+c.dir+'</div></div>'
      +'<div><div style="font-size:10px;text-transform:uppercase;color:#9ca3af;font-weight:600;">Inquilino</div><div style="font-size:13px;font-weight:600;margin-top:3px;">'+c.inquilino+'</div></div></div>'
      +'<table style="width:100%;border-collapse:collapse;margin-bottom:14px;">'
      +'<thead><tr style="background:#f3f4f6;"><th style="padding:7px 10px;text-align:left;font-size:11px;color:#6b7280;text-transform:uppercase;">Concepto</th><th style="padding:7px 10px;text-align:right;font-size:11px;color:#6b7280;text-transform:uppercase;">Importe</th></tr></thead>'
      +'<tbody>'+fHTML+totRow+'</tbody></table>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:18px;">'
      +'<div style="border-top:1px solid #374151;padding-top:5px;text-align:center;font-size:10px;color:#9ca3af;">Firma — '+(copia==='inquilino'?'Inmobiliaria':'Inquilino')+'</div>'
      +'<div style="border-top:1px solid #374151;padding-top:5px;text-align:center;font-size:10px;color:#9ca3af;">Firma — '+(copia==='inquilino'?'Inquilino':'Inmobiliaria')+'</div></div>'
      +'<div style="margin-top:10px;text-align:center;font-size:10px;color:#9ca3af;border-top:1px dashed #d1d5db;padding-top:6px;">Copia: '+(copia==='inquilino'?'INQUILINO':'INMOBILIARIA')+'</div></div>';
  }

  var fA=!mABL&&nABL,fY=!mAYSA&&nAYSA,fL=!mLuz&&nLuz;
  if(!fA&&!fY&&!fL){

function generarLiquidacion(c,extra){
  var alq=Number(extra.alquiler)||c.valor;
  var hon=Number(extra.honorario)||0;
  var items=[];
  items.push({concepto:'Alquiler',periodo:extra.mesPeriodo,importe:alq});
  if(c.montoLuz)items.push({concepto:'Edesur / Luz',nro:c.nroLuz||'',periodo:extra.mesPeriodo,importe:c.montoLuz,abonado:true});
  if(c.montoAYSA)items.push({concepto:'AYSA',nro:c.nroAYSA||'',periodo:extra.mesPeriodo,importe:c.montoAYSA,abonado:true});
  if(c.montoABL)items.push({concepto:'ABL',nro:c.nroABL||'',periodo:extra.mesPeriodo,importe:c.montoABL,abonado:true});
  if(extra.items&&extra.items.length)extra.items.forEach(function(it){if(it.concepto&&it.importe)items.push(it);});
  if(hon>0)items.push({concepto:'Honorario NVP',periodo:extra.mesPeriodo,importe:-hon});
  var total=items.reduce(function(a,it){return a+it.importe;},0);
  var hoy=extra.fechaEmision?new Date(extra.fechaEmision+'T00:00:00'):new Date();
  var fechaStr=hoy.getDate()+'/'+(hoy.getMonth()+1)+'/'+hoy.getFullYear();

  var hist=[];try{hist=JSON.parse(localStorage.getItem('nvp_liquidaciones')||'[]');}catch{}
  hist.push({id:'liq'+Date.now(),contratoId:c.id,dir:c.dir,inquilino:c.inquilino,
    mes:extra.mesKey||new Date().toISOString().slice(0,7),periodo:extra.mesPeriodo,
    alquiler:alq,honorario:hon,total:total,medioPago:extra.medioPago,
    fecha:extra.fechaEmision||new Date().toISOString().slice(0,10),nro:extra.nroLiquidacion});
  localStorage.setItem('nvp_liquidaciones',JSON.stringify(hist));

  var css='*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Arial,sans-serif;background:#f3f4f6;}'
    +'.tb{background:#1e1b4b;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;}'
    +'.pg{background:#fff;max-width:720px;margin:0 auto;}'
    +'.ct{text-align:center;font-size:10px;color:#bbb;letter-spacing:.1em;padding:4px 0;border-top:1px dashed #d1d5db;border-bottom:1px dashed #d1d5db;}'
    +'@media print{body{background:#fff;}.tb{display:none!important;}.pg{max-width:100%;}'
    +'.rc{height:134mm;overflow:hidden;page-break-inside:avoid;}'
    +'.ct{padding:2px 0;}@page{size:A4;margin:4mm 6mm;}}';
  var w=window.open('','_blank','width=820,height=1100');
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Liquidación</title><style>'+css+'</style></head><body>'
    +'<div class="tb">'
    +'<button onclick="window.print()" style="background:#6d28d9;color:#fff;border:none;padding:8px 20px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;">🖨️ Imprimir</button>'
    +'<button onclick="window.close()" style="background:rgba(255,255,255,.15);color:#fff;border:none;padding:8px 14px;border-radius:7px;font-size:13px;cursor:pointer;">Cerrar</button>'
    +'<span style="font-size:11px;opacity:.55;margin-left:6px;">Dos copias — hoja A4</span></div>'
    +'<div class="pg">'
    +'<div class="rc">'+htmlLiq('PROPIETARIO',extra.nroLiquidacion,fechaStr,extra.mesPeriodo,c,items,total,extra.medioPago)+'</div>'
    +'<div class="ct">✂ &nbsp; C O R T A R &nbsp; ✂</div>'
    +'<div class="rc">'+htmlLiq('INMOBILIARIA',extra.nroLiquidacion,fechaStr,extra.mesPeriodo,c,items,total,extra.medioPago)+'</div>'
    +'</div></body></html>');
  w.document.close();
}

      +(esLocal?'<div><label style="font-size:12px;font-weight:500;display:block;margin-bottom:3px;">Dom. garante</label><input id="mcdomgar" style="width:100%;padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;"></div>'
        +'<div><label style="font-size:12px;font-weight:500;display:block;margin-bottom:3px;">Inmueble garante</label><input id="mcinmgar" style="width:100%;padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;"></div>':'')

      };

      }

      if(esLocal2)window._generarContratoLocal(cCopy,extra);

  }
  document.body.appendChild(overlay);

// ── GENERADORES DE CONTRATOS ──────────────────────────────────────────
function _nl(n){var m={'3':'tres','6':'seis','12':'doce','18':'dieciocho','24':'veinticuatro','36':'treinta y seis','48':'cuarenta y ocho'};return m[String(n)]||String(n);}
function _mU(d){return d.toLocaleDateString('es-AR',{month:'long'}).toUpperCase();}
function _venc(s,m){if(!s)return{dia:'__',mes:'__',anio:'__'};var d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+parseInt(m));d.setDate(d.getDate()-1);return{dia:d.getDate(),mes:_mU(d),anio:d.getFullYear()};}

  w.document.close();

    +'<p>Se firman 2 ejemplares en CABA, a los <b>'+dF+'</b> días del mes de <b>'+mF+'</b> de <b>'+aF+'</b>.-</p>';
  var f=locs.map(function(l){return{nombre:(l.nombre||'').toUpperCase(),rol:'LOCADOR'};});
  f.push({nombre:nI,rol:'LOCATARIO'+(x.esEmpresa?' (Rep. Legal)':'')});
  if(nG)f.push({nombre:nG,rol:'FIADOR GARANTE'});
  _winContrato(body,f,'Contrato Comercial — '+c.dir);
};

// ── AVISOS MASIVOS ────────────────────────────────────────────────────
function buildPanelAvisos(){
  var content=document.querySelector('.content');
  if(!content||document.getElementById('nvp-ext-panel'))return;
  var contratos=getContratos(),ipc=getIPC(),cfg=getCfg();
  var conTel=contratos.filter(function(c){return c.tel;});
  var pm=new Date(new Date().getFullYear(),new Date().getMonth()+1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'}).replace(/^\w/,function(c){return c.toUpperCase();});
  var panel=document.createElement('div');panel.id='nvp-ext-panel';panel.style.cssText='margin-bottom:16px;';
  panel.innerHTML='<div style="background:#1e1b4b;border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">'
    +'<div><div style="color:#fff;font-weight:600;font-size:14px;">📱 Envío masivo — '+pm+'</div>'
    +'<div style="color:#a5b4fc;font-size:12px;margin-top:2px;">'+conTel.length+' con teléfono</div></div>'
    +'<button id="nvp-mass-btn" style="background:#7c3aed;color:#fff;border:none;padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;">📤 WA a todos ('+conTel.length+')</button>'
    +'</div><div id="nvp-mass-status" style="font-size:12px;color:#6b7280;min-height:14px;padding:4px 0;"></div>';
  content.insertBefore(panel,content.firstChild);
  var queue=[],qi=0;
  function sn(){
    if(qi>=queue.length){var st=document.getElementById('nvp-mass-status');if(st)st.textContent='✅ Listo.';var bn=document.getElementById('nvp-mass-btn');if(bn)bn.disabled=false;queue=[];qi=0;return;}
    var c=queue[qi];var a=proxAumento(c);var tA=a&&Math.abs(a.dias)<=35;var alq=tA?nvC(c,ipc):c.valor;
    var mA=c.montoABL||0,mY=c.montoAYSA||0,mL=c.montoLuz||0,nA=c.nroABL||'',nY=c.nroAYSA||'',nL=c.nroLuz||'',ts=mA+mY+mL;
    var pms=new Date(new Date().getFullYear(),new Date().getMonth()+1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
    function fm(v,m){return m==='USD'?'USD '+Number(v).toLocaleString('es-AR'):'$'+Number(v).toLocaleString('es-AR');}
    var L=['━━━━━━━━━━━━━━━━━━━━━━','📍 *Dirección:* '+c.dir,'📅 *Período:* '+pms,'','🏠 *Alquiler:* '+fm(alq,c.moneda)+(tA?' _(actualizado)_':'')];
    if(c.tipo!=='galeria'){L.push('');
      if(mL)L.push('💡 *Luz:* $'+mL.toLocaleString('es-AR')+(nL?'  _(N° '+nL+')_':''));else if(nL)L.push('💡 *Luz N° '+nL+'* _(pendiente)_');
      if(mY)L.push('💧 *AYSA:* $'+mY.toLocaleString('es-AR')+(nY?'  _(N° '+nY+')_':''));else if(nY)L.push('💧 *AYSA N° '+nY+'* _(pendiente)_');
      if(mA)L.push('🏛️ *ABL:* $'+mA.toLocaleString('es-AR')+(nA?'  _(N° '+nA+')_':''));else if(nA)L.push('🏛️ *ABL N° '+nA+'* _(pendiente)_');
      if(ts>0){L.push('');L.push('💰 *TOTAL: '+(c.moneda==='ARS'?fm(alq+ts,'ARS'):'$'+ts.toLocaleString('es-AR')+' + '+fm(alq,'USD'))+'*');}
    }
    L.push('','━━━━━━━━━━━━━━━━━━━━━━','_'+(cfg.agencia||'Nicolás Ventura Propiedades')+'_','_Matrícula CUCICBA '+(cfg.matricula||'6811')+'_');
    var msg=L.join('\n');var tel=c.tel?'54'+c.tel.replace(/\D/g,''):'';
    window.open(tel?'https://wa.me/'+tel+'?text='+encodeURIComponent(msg):'https://wa.me/?text='+encodeURIComponent(msg),'_blank');
    var st=document.getElementById('nvp-mass-status');if(st)st.textContent='📤 '+(qi+1)+'/'+queue.length+': '+c.inquilino.split(',')[0];
    qi++;setTimeout(sn,2800);
  }
  document.getElementById('nvp-mass-btn').onclick=function(){
    if(!confirm('¿Abrir WhatsApp para '+conTel.length+' inquilinos?'))return;
    queue=conTel;qi=0;this.disabled=true;setTimeout(sn,400);
  };
}

// ── INYECCIÓN DE BOTONES — UN SOLO SETINTERVAL ────────────────────────
var _pg='';

function inyectarTodos(){
  var tbody=document.querySelector('table tbody');
  if(!tbody)return;

  // Build lookup by dir for matching
  var allContratos=getContratos().filter(function(c){return c.tipo!=='galeria';});
  if(!allContratos.length)return;
  var byDir={};
  allContratos.forEach(function(c){byDir[(c.dir||'').trim()]=c;});

  // Add column headers once
  var thead=document.querySelector('table thead tr');
  var hIds=['nvp-th-rec','nvp-th-liq','nvp-th-cont'];
  var hTxts=['Recibo','Liquidación','Contrato'];
  hIds.forEach(function(id,i){
    if(thead&&!document.getElementById(id)){
      var th=document.createElement('th');th.id=id;th.textContent=hTxts[i];
      th.style.cssText='padding:9px 10px;font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;';
      thead.appendChild(th);
    }
  });

  // Inject buttons into rows that don't have them yet
  var rows=tbody.querySelectorAll('tr');
  rows.forEach(function(row){
    if(row.querySelector('[data-btns]'))return;
    // Read dir from cell index 2
    var cells=row.querySelectorAll('td');
    if(cells.length<3)return;
    var dirTxt=(cells[2].textContent||'').trim();
    var c=byDir[dirTxt];
    if(!c)return;

    function mkBtn(emoji,title,fn){
      var b=document.createElement('button');
      b.textContent=emoji;b.title=title;
      b.style.cssText='background:transparent;border:none;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px;';
      b.onmouseenter=function(){this.style.background='#ede9fe';};
      b.onmouseleave=function(){this.style.background='transparent';};
      b.onclick=function(e){e.stopPropagation();try{fn();}catch(err){console.error('NVP:',err);}};
      return b;
    }

    var tdR=document.createElement('td');tdR.style.padding='4px 6px';
    tdR.appendChild(mkBtn('🖨️','Recibo',function(){generarRecibo(c,null);}));
    row.appendChild(tdR);

    var tdL=document.createElement('td');tdL.style.padding='4px 6px';
    tdL.appendChild(mkBtn('📋','Liquidación',function(){abrirModalLiquidacion(c);}));
    row.appendChild(tdL);

    var tdC=document.createElement('td');
    tdC.setAttribute('data-btns','1');
    tdC.style.cssText='padding:4px 6px;display:flex;align-items:center;gap:2px;';
    tdC.appendChild(mkBtn('📄','Contrato',function(){abrirModalContrato(c);}));

    // Add 🏗️ for expired contracts
    if(c.fin){
      var hoy=new Date();hoy.setHours(0,0,0,0);
      if(Math.round((new Date(c.fin+'T00:00:00')-hoy)/86400000)<0){
        tdC.appendChild(mkBtn('🏗️','Pasar a vacante',function(){
          if(!confirm('¿Mover "'+c.dir+'" a Vacantes?'))return;
          var vacs=[];try{vacs=JSON.parse(localStorage.getItem('nvp_vacantes')||'[]');}catch{}
          if(vacs.find(function(v){return v.dir===c.dir;})){alert('Ya existe en vacantes.');return;}
          vacs.push({id:'vac'+Date.now(),tipo:c.tipo==='depto'?'depto':'local',dir:c.dir,desc:'',
            precioUSD:0,precioARS:0,notas:'Disponible desde '+new Date().toLocaleDateString('es-AR'),
            disponibleDesde:new Date().toISOString().slice(0,10)});
          localStorage.setItem('nvp_vacantes',JSON.stringify(vacs));
          alert('✅ Agregada a Propiedades Vacantes.');
        }));
      }
    }
    row.appendChild(tdC);
  });
}

setInterval(function(){
  var t=document.querySelector('.topbar-title');
  if(!t)return;
  var pg=t.textContent;
  if(pg!==_pg){
    _pg=pg;
    var ep=document.getElementById('nvp-ext-panel');if(ep)ep.remove();
    if(pg==='Avisos fin de mes')setTimeout(buildPanelAvisos,200);
  }
  if(pg==='Contratos')inyectarTodos();
},400);

})();
</script>
