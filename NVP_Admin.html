:root{--v:#6d28d9;--vl:#7c3aed;--vp:#ede9fe;--vm:#c4b5fd;--g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g500:#6b7280;--g700:#374151;--g900:#111827;--gr:#059669;--grl:#d1fae5;--am:#d97706;--aml:#fef3c7;--rd:#dc2626;--rdl:#fee2e2;--bl:#2563eb;--bll:#dbeafe}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--g50);color:var(--g900)}
#root{display:flex;height:100vh;overflow:hidden}
.sb{width:240px;min-width:240px;background:var(--g900);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:20px 20px 16px;border-bottom:1px solid #1f2937}
.sb-brand{font-size:22px;font-weight:800;color:#fff}
.sb-sub{color:var(--vm);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-sec{padding:14px 20px 4px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#4b5563}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 20px;cursor:pointer;color:#9ca3af;font-size:13px;border-left:2px solid transparent;transition:all .15s}
.nav-item:hover{color:#fff;background:#1f2937}
.nav-item.active{color:#fff;background:#1f2937;border-left-color:var(--vl)}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--rd);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}
.sb-foot{padding:12px 16px;border-top:1px solid #1f2937}
.ipc-box{background:#1f2937;border-radius:8px;padding:8px 12px}
.ipc-label{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.06em}
.ipc-val{font-size:16px;font-weight:700;color:var(--vm);margin-top:1px}
.ipc-date{font-size:10px;color:#4b5563;margin-top:1px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid var(--g200);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar-title{font-size:17px;font-weight:600;flex-shrink:0}
.topbar-actions{display:flex;gap:8px;align-items:center}
.content{flex:1;overflow-y:auto;padding:20px 28px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--vl);color:#fff}.btn-primary:hover{background:var(--v)}
.btn-secondary{background:#fff;color:var(--g700);border:1px solid var(--g200)}.btn-secondary:hover{background:var(--g50)}
.btn-ghost{background:transparent;color:var(--g500);padding:5px 8px}.btn-ghost:hover{background:var(--g100)}
.btn-danger{background:var(--rdl);color:var(--rd);border:none}.btn-danger:hover{background:#fca5a5}
.btn-green{background:var(--grl);color:var(--gr);border:none}
.btn-sm{padding:4px 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:18px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;color:var(--g700)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat-card{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:16px}
.stat-label{font-size:10px;font-weight:500;color:var(--g500);text-transform:uppercase;letter-spacing:.06em}
.stat-value{font-size:26px;font-weight:700;margin:4px 0 2px}
.stat-sub{font-size:11px;color:var(--g500)}
.stat-card.violet{border-left:3px solid var(--vl)}
.stat-card.green{border-left:3px solid var(--gr)}
.stat-card.blue{border-left:3px solid var(--bl)}
.stat-card.amber{border-left:3px solid var(--am)}
.stat-card.red{border-left:3px solid var(--rd)}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:8px;border:1px solid}
.alert-item.red{background:var(--rdl);border-color:#fca5a5}
.alert-item.amber{background:var(--aml);border-color:#fcd34d}
.alert-item.blue{background:var(--bll);border-color:#93c5fd}
.alert-item.violet{background:var(--vp);border-color:var(--vm)}
.alert-item.green{background:var(--grl);border-color:#6ee7b7}
.alert-body{flex:1;min-width:0}
.alert-title{font-size:13px;font-weight:600}
.alert-desc{font-size:12px;color:var(--g700);margin-top:2px}
.alert-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.venc-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--g100)}
.venc-row:hover{background:var(--g50)}
.venc-row:last-child{border-bottom:none}
.dias-badge{display:inline-flex;align-items:center;justify-content:center;min-width:56px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.dias-badge.rojo{background:var(--rdl);color:var(--rd)}
.dias-badge.naranja{background:#ffedd5;color:#c2410c}
.dias-badge.amarillo{background:var(--aml);color:var(--am)}
.dias-badge.verde{background:var(--grl);color:var(--gr)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--g50);padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--g200);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--g100);vertical-align:middle}
tbody tr:hover{background:var(--g50)}
tbody tr:last-child td{border-bottom:none}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-galeria{background:var(--vp);color:var(--v)}
.badge-local{background:var(--bll);color:var(--bl)}
.badge-depto{background:var(--grl);color:var(--gr)}
.badge-deposito{background:#fef3c7;color:#92400e}
.badge-activo{background:var(--grl);color:var(--gr)}
.badge-por-vencer{background:var(--aml);color:var(--am)}
.badge-vencido{background:var(--rdl);color:var(--rd)}
.badge-pesos{background:var(--g100);color:var(--g700)}
.badge-usd{background:#d1fae5;color:#065f46}
.badge-pagado{background:var(--grl);color:var(--gr)}
.badge-pendiente{background:var(--aml);color:var(--am)}
.badge-vacio{background:#f3e8ff;color:#7e22ce}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--g200);background:#fff;color:var(--g500);transition:all .15s}
.filter-btn.active{background:var(--vl);color:#fff;border-color:var(--vl)}
.search-input{padding:6px 12px;border:1px solid var(--g200);border-radius:7px;font-size:13px;outline:none}
.search-input:focus{border-color:var(--vm)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;border-radius:12px 12px 0 0;z-index:1}
.modal-title{font-size:15px;font-weight:600}
.modal-body{padding:18px 22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--g200);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff;border-radius:0 0 12px 12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
label{font-size:12px;font-weight:500;color:var(--g700)}
input,select,textarea{padding:7px 10px;border:1px solid var(--g200);border-radius:6px;font-size:13px;font-family:inherit;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--vm);box-shadow:0 0 0 3px rgba(196,181,253,.15)}
textarea{resize:vertical;min-height:70px}
.wa-preview{background:#e7fdb5;border-radius:0 0 10px 10px;padding:14px 16px;font-size:13px;line-height:1.7;white-space:pre-wrap;border:1px solid #c8e57a;border-top:none}
.wa-header{background:#075e54;color:#fff;border-radius:10px 10px 0 0;padding:9px 14px;font-size:12px;font-weight:600}
.calc-box{background:var(--vp);border:1px solid var(--vm);border-radius:10px;padding:14px}
.calc-result{font-size:22px;font-weight:700;color:var(--v)}
.divider{height:1px;background:var(--g200);margin:12px 0}
.text-muted{color:var(--g500);font-size:12px}
.fw600{font-weight:600}
.mt8{margin-top:8px}
.empty{text-align:center;padding:40px 20px;color:var(--g500)}
.empty .icon{font-size:36px;margin-bottom:10px}
.empty .msg{font-size:14px;font-weight:500}
.config-section{margin-bottom:20px}
.config-section h3{font-size:13px;font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--g200)}
.toast-container{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .2s ease;pointer-events:auto}
.toast.success{background:var(--gr)}.toast.error{background:var(--rd)}.toast.info{background:var(--vl)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.pending-banner{background:#1e1b4b;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.pending-dot{width:8px;height:8px;border-radius:50%;background:#f87171;flex-shrink:0;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--g200);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--g500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab.active{color:var(--vl);border-bottom-color:var(--vl)}
.tab:hover{color:var(--g700)}
.pago-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--g100)}
.pago-row:last-child{border-bottom:none}
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--g100);font-size:13px}
.hist-row:last-child{border-bottom:none}
.hist-row:hover{background:var(--g50)}
.vacante-card{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:14px;position:relative}
.vacante-card:hover{border-color:var(--vm);box-shadow:0 2px 8px rgba(109,40,217,.08)}
.vacante-precio{font-size:15px;font-weight:700;color:var(--v)}
.gasto-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--g100);font-size:13px}
.section-title{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--g900)}

<script>
(function(){
function numLetras(n){var m={'3':'tres','6':'seis','12':'doce','18':'dieciocho','24':'veinticuatro','36':'treinta y seis','48':'cuarenta y ocho'};return m[String(n)]||String(n);}
function mesNombreUP(d){return d.toLocaleDateString('es-AR',{month:'long'}).toUpperCase();}
function calcVenc(inicioStr,meses){
  if(!inicioStr)return{dia:'__',mes:'__________',anio:'____'};
  var d=new Date(inicioStr+'T00:00:00');d.setMonth(d.getMonth()+parseInt(meses));d.setDate(d.getDate()-1);
  return{dia:d.getDate(),mes:mesNombreUP(d),anio:d.getFullYear()};
}
function getContratos(){try{return JSON.parse(localStorage.getItem('nvp_c')||'[]');}catch{return[];}}

function abrirVentana(body,firmasArr,titulo){
  var fHTML='<div style="display:flex;flex-wrap:wrap;gap:28px;justify-content:center;margin-top:48px;">';
  firmasArr.forEach(function(f){fHTML+='<div style="text-align:center;min-width:180px;"><div style="border-top:1px solid #000;padding-top:6px;"><div style="font-size:10pt;font-weight:bold;">'+f.rol+'</div><div style="font-size:9pt;font-style:italic;margin-top:3px;">'+f.nombre+'</div></div></div>';});
  fHTML+='</div>';
  var w=window.open('','_blank','width=880,height=980');
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+titulo+'</title><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:"Times New Roman",serif;font-size:12pt;background:#fff;padding:30px 60px;max-width:920px;margin:0 auto;line-height:1.6;}p{margin-bottom:10px;text-align:justify;}@media print{.no-print{display:none!important;}body{padding:15px 40px;}}</style></head><body><div class="no-print" style="text-align:center;margin-bottom:20px;"><button onclick="window.print()" style="background:#7c3aed;color:#fff;border:none;padding:10px 28px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;margin-right:8px;">🖨️ Imprimir</button><button onclick="window.close()" style="background:#f3f4f6;border:1px solid #ddd;padding:10px 16px;border-radius:7px;font-size:14px;cursor:pointer;">Cerrar</button></div>'+body+fHTML+'</body></html>');
  w.document.close();
}

function generarContratoDepto(c,x){
  var ini=c.inicio?new Date(c.inicio+'T00:00:00'):new Date();
  var firma=x.fechaFirma?new Date(x.fechaFirma+'T00:00:00'):new Date();
  var venc=calcVenc(c.inicio,x.plazoMeses||24);
  var dF=firma.getDate(),mF=firma.toLocaleDateString('es-AR',{month:'long'}),aF=firma.getFullYear();
  var dI=ini.getDate(),mI=mesNombreUP(ini),aI=ini.getFullYear();
  var nLoc=(x.nombreLocador||'__________').toUpperCase();
  var nInq=(c.inquilino||'__________').toUpperCase();
  var nGar=(x.nombreGarante||'').toUpperCase();
  var g=nGar?1:0;
  var clas=['DÉCIMA TERCERA','DÉCIMA CUARTA','DÉCIMA QUINTA','DÉCIMA SEXTA','DÉCIMA SÉPTIMA','DÉCIMA OCTAVA','DÉCIMA NOVENA','VIGÉSIMA'];
  function cl(base){return clas[base-13+g]||('N°'+(base+g));}

  var body='<p style="text-align:center;font-weight:bold;font-size:14pt;text-decoration:underline;">CONTRATO DE LOCACIÓN DE INMUEBLE</p>'
    +'<p style="text-align:center;font-weight:bold;">(VIVIENDA — SIN MUEBLES)</p><br>'
    +'<p style="text-align:center;font-weight:bold;text-decoration:underline;">DE LA CELEBRACION</p>'
    +'<p>Este contrato de locación es celebrado de total y común acuerdo entre las partes que se mencionarán, en la Ciudad de Buenos Aires, siendo el día <b>'+dF+'</b> del mes de <b>'+mF+'</b> del <b>'+aF+'</b>---</p>'
    +'<p style="text-align:center;font-weight:bold;text-decoration:underline;">PARTES</p>'
    +'<p><b><u>a) LOCADOR: '+nLoc+'</u></b> Quien acredita su identidad con DNI Nº '+(x.dniLocador||'__')+', con domicilio en la calle '+(x.domLocador||'__')+', en su carácter de "<u>LOCADOR</u>", (en adelante, el "<u>LOCADOR</u>"). -------</p>'
    +'<p><b><u>b) LOCATARIO: '+nInq+'</u></b> DNI: '+(c.dni||'__________')+' con domicilio en la calle '+c.dir+' (en adelante, el "<u>LOCATARIO</u>"). -----</p>'
    +'<p>Ambas Partes convienen en celebrar este contrato de locación, que quedará sujeto a las estipulaciones que siguen y por lo dispuesto sobre la materia en el Código Civil y Comercial de la Nación, obligándose estas a su estricto y fiel cumplimiento. --------------------------------</p>'
    +'<p><b><u>PRIMERA: OBJETO:</u></b> El LOCADOR da en locación al LOCATARIO el departamento desocupado ubicado en la calle <b>'+c.dir+'</b>, sujeto al Régimen de la Ley 13.512, con objeto de alquiler de vivienda temporal de Propiedad Horizontal (el "<u>Inmueble</u>"). El Inmueble se alquila en perfecto estado de conservación, que el LOCATARIO declara conocer por haberlo visitado. -</p>'
    +'<p><b><u>SEGUNDA: PLAZO:</u></b> El plazo de esta locación es de <b>'+(x.plazoMeses||24)+' ('+numLetras(x.plazoMeses||24)+') meses</b>, a contarse desde el día <b>'+dI+' de '+mI+' del año '+aI+',</b> por lo que su vencimiento se operará de pleno derecho el día <b>'+venc.dia+' de '+venc.mes+' del '+venc.anio+'</b>, sin necesidad de notificación o requerimiento alguno por parte del LOCADOR. ------------------------------------------------------</p>'
    +'<p><b><u>TERCERA: PRECIO:</u></b> El precio de la locación es de <b>$'+Number(c.valor).toLocaleString('es-AR')+' mensuales</b> más expensas. El Precio será abonado por mes adelantado del uno al quinto día de cada mes. La mora se producirá en forma automática, con una multa de $ 10.000 diarios por cada día de demora. <b>El valor del alquiler tendrá un ajuste '+(x.tipoAjuste||'trimestral según IPC acumulado')+'.</b></p>'
    +'<p><b><u>CUARTA: IMPUESTOS, TASAS Y SERVICIOS:</u></b> Serán a cargo del LOCATARIO: energía eléctrica, gas, teléfono, internet, televisión por cable y agua, debiendo entregar las facturas canceladas al LOCADOR mensualmente. -----</p>'
    +'<p><b><u>QUINTA: DESTINO DE LA LOCACION:</u></b> El LOCATARIO destinará el inmueble para vivienda propia y familiar, no pudiéndole dar otro destino (art. 1194 CCyCN). Asimismo, el LOCATARIO se obliga a no subarrendar el todo o parte del Inmueble, ni a transferir o ceder este contrato sin autorización del LOCADOR.</p>'
    +'<p><b><u>SEXTA: MODIFICACIONES:</u></b> El LOCATARIO no podrá introducir modificaciones ni hacer obra alguna en el Inmueble sin la autorización escrita del LOCADOR. Las mejoras que realizara quedarán a beneficio del Inmueble sin indemnización alguna. -----------------</p>'
    +'<p><b><u>SÉPTIMA: USO:</u></b> El LOCATARIO deberá acatar todas las normas del reglamento de copropiedad y reglamento interno del edificio. Queda prohibida la tenencia de animales sin autorización previa del LOCADOR. El incumplimiento de esta cláusula dará derecho al LOCADOR a solicitar el inmediato desalojo.</p>'
    +'<p><b><u>OCTAVA: REPARACIONES:</u></b> Será por cuenta del LOCATARIO la conservación de los artefactos del Inmueble y las reparaciones de los desperfectos provocados por el mal uso. El LOCATARIO permitirá la entrada al Inmueble al LOCADOR para inspeccionar el estado del mismo. ------------------------------------</p>'
    +'<p><b><u>NOVENA: IRRESPONSABILIDAD:</u></b> El LOCADOR no se responsabiliza de los daños y perjuicios por inundaciones, incendio, derrumbes, explosiones, robo, filtraciones y desprendimientos provenientes de roturas, desperfectos de caños o techos, o cualquier otro accidente producido en el Inmueble y/o edificios linderos. ---------------------------------------------------</p>'
    +'<p><b><u>DÉCIMA: INCUMPLIMIENTO:</u></b> La falta de cumplimiento de cualquiera de las cláusulas del presente contrato por parte del LOCATARIO dará opción al LOCADOR de resolver el contrato por culpa del LOCATARIO, pudiendo exigir el inmediato desalojo del Inmueble y reservándose el derecho de reclamar por daños y perjuicios. --</p>'
    +'<p><b><u>DÉCIMA PRIMERA: ENTREGA DEL INMUEBLE:</u></b> El LOCATARIO se obliga a entregar desocupado el Inmueble al finalizar el Plazo, totalmente libre de cualquier tipo de ocupantes. La mora será automática y hará surgir, en concepto de multa, un alquiler que será el doble del vigente por cada mes o fracción en que persista la ocupación indebida. ---------</p>'
    +'<p><b><u>DÉCIMA SEGUNDA: ENTREGA DE LAS LLAVES:</u></b> La entrega de las llaves del Inmueble deberá justificarla el LOCATARIO con documento escrito del LOCADOR, no admitiéndose otro medio de prueba. El alquiler regirá hasta el día en que el LOCADOR tome posesión real y efectiva del Inmueble. ------------------------------</p>'
    +(nGar?'<p><b><u>DÉCIMA TERCERA: GARANTÍA:</u></b> El/La Sr./Sra. <b>'+nGar+'</b> DNI: '+(x.dniGarante||'__')+' se constituye en fiador liso y llano, y principal pagador de todas las sumas emergentes de la presente locación, con renuncia expresa al beneficio de división y excursión. --------------------------------</p>':'')
    +'<p><b><u>'+cl(13)+': DEPOSITO:</u></b> En garantía del fiel cumplimiento, el LOCATARIO entrega en este acto la suma de <b>'+(x.deposito||'_____________')+'</b>. Dicha suma será reintegrada una vez entregado el Inmueble, efectuadas las deducciones que hubiere lugar. El LOCATARIO no podrá imputar este depósito a pagar alquileres u otras obligaciones mientras esté vigente el Plazo. ------------</p>'
    +'<p><b><u>'+cl(14)+': AUSENCIA DEL LOCATARIO:</u></b> En caso de ausencia transitoria, el LOCATARIO deberá notificar de forma fehaciente al LOCADOR suministrando el nombre, dirección y teléfono de la persona que tendrá la llave del Inmueble. -----------------------</p>'
    +'<p><b><u>'+cl(15)+': ABANDONO:</u></b> En caso de abandono manifiesto, el LOCADOR podrá ingresar al Inmueble ante concurrencia de un Escribano Público, siendo todos los gastos a cargo exclusivo del LOCATARIO.</p>'
    +'<p><b><u>'+cl(16)+': IMPUESTO DE SELLOS:</u></b> De corresponder la aplicación del impuesto de sellos será abonado por el LOCATARIO en su totalidad. ------------------------</p>'
    +'<p><b><u>'+cl(17)+': NOTIFICACIONES Y DOMICILIOS:</u></b> A todos los efectos derivados de este contrato, las Partes constituyen domicilios especiales en los indicados en el encabezado del presente. -------------------------------------------------------</p>'
    +'<p><b><u>'+cl(18)+': RESCISIÓN ANTICIPADA:</u></b> Queda establecido entre las partes que el presente contrato de locación podrá ser rescindido a opción del LOCATARIO, una vez cumplidos los primeros SEIS (06) MESES de locación, debiendo notificar al LOCADOR su decisión con SESENTA (60) días de anticipación, mediante telegrama colacionado. Si hace uso de la opción resolutoria en el primer año de vigencia de la relación locativa, debe abonar al locador, en concepto de indemnización, la suma equivalente a un mes y medio de alquiler al momento de desocupar el inmueble y la de un mes si la opción se ejercita transcurrido dicho lapso, según el art. 1221 del Código Civil y Comercial. -----</p>'
    +'<p><b><u>'+cl(19)+': JURISDICCION:</u></b> Cualquier disputa será decidida por los Juzgados Nacionales Ordinarios en lo Civil de la Ciudad Autónoma de Buenos Aires, renunciando las Partes en forma expresa a cualquier otro fuero o jurisdicción que pudiera corresponderles. -----------------------------------------------------------------------</p>'
    +'<p>En prueba de conformidad, se firman 2 (DOS) ejemplares de un mismo tenor y a un solo efecto. A los '+dF+' días del mes de '+mF+' del año '+aF+'. -------------------------------------------------------</p>';

  var firmas=[{nombre:nLoc,rol:'LOCADOR'},{nombre:nInq,rol:'LOCATARIO'}];
  if(nGar)firmas.push({nombre:nGar,rol:'GARANTE'});
  abrirVentana(body,firmas,'CONTRATO VIVIENDA — '+c.dir);
}

function generarContratoLocal(c,x){
  var ini=c.inicio?new Date(c.inicio+'T00:00:00'):new Date();
  var firma=x.fechaFirma?new Date(x.fechaFirma+'T00:00:00'):new Date();
  var venc=calcVenc(c.inicio,x.plazoMeses||36);
  var dF=firma.getDate(),mF=firma.toLocaleDateString('es-AR',{month:'long'}).toUpperCase(),aF=firma.getFullYear();
  var dI=ini.getDate(),mI=mesNombreUP(ini),aI=ini.getFullYear();
  var locs=x.locadores||[{nombre:x.nombreLocador||'__________',dni:x.dniLocador||'__',cuil:'',domicilio:x.domLocador||'__'}];
  var locHTML=locs.map(function(l){return'<b>'+(l.nombre||'').toUpperCase()+'</b> con DNI: '+(l.dni||'__')+(l.cuil?' CUIL: '+l.cuil:'')+' con domicilio en la calle '+(l.domicilio||'__');}).join(', y ');
  var nInq=(x.razonSocial||c.inquilino||'__________').toUpperCase();
  var idInq=x.esEmpresa?'CUIT: '+(x.cuitInq||'__'):'DNI: '+(c.dni||'__');
  var nGar=(x.nombreGarante||'').toUpperCase();
  var g=nGar?1:0;
  var rubro=x.rubro||'comercio en general';
  var dep=x.deposito||'_____________';
  var dG=nGar?'DECIMA CUARTA':'DECIMA TERCERA';
  var dJ=nGar?'DECIMA QUINTA':'DECIMA CUARTA';
  var dK=nGar?'DECIMA SEXTA':'DECIMA QUINTA';
  var dL=nGar?'DECIMA SEPTIMA':'DECIMA SEXTA';
  var dM=nGar?'DECIMA OCTAVA':'DECIMA SEPTIMA';
  var dN=nGar?'DECIMA NOVENA':'DECIMA OCTAVA';
  var dO=nGar?'VIGESIMA':'DECIMA NOVENA';
  var dP=nGar?'VIGESIMA PRIMERA':'VIGESIMA';

  var body='<p style="text-align:center;font-weight:bold;font-size:14pt;">CONTRATO DE LOCACION</p><br>'
    +'<p>Entre las partes '+locHTML+', denominado la parte <b>LOCADORA</b>, por una parte y por la otra <b>'+nInq+'</b>, '+idInq+' con domicilio en la calle '+(x.domInq||c.dir)+', en adelante denominado la parte <b>LOCATARIA</b>, convienen en celebrar el presente contrato de locación sujeto a las siguientes cláusulas y condiciones:</p>'
    +'<p><b>PRIMERA</b>: La Locadora cede en locación a la locataria el local de comercio sito en la calle <b>'+c.dir+'</b>, CABA. -</p>'
    +'<p><b>SEGUNDA</b>: El término de este contrato es de <b>'+(x.plazoMeses||36)+' ('+numLetras(x.plazoMeses||36)+') MESES'+(x.diasExtra?' y '+x.diasExtra+' días':'')+', a contar desde el día '+(dI)+' de '+mI+' del '+aI+' por lo que su vencimiento se operará de pleno derecho el día '+venc.dia+' de '+venc.mes+' del '+venc.anio+'</b> sin necesidad de notificación o requerimiento alguno por parte de la Locadora. --</p>'
    +'<p><b>TERCERA</b>: El alquiler se conviene en la suma de <b>$'+Number(c.valor).toLocaleString('es-AR')+'</b> mensuales. <b>'+(x.tipoAjuste||'Aumento trimestral por IPC ACUMULADO')+'.</b></p>'
    +'<p><b>CUARTA</b>: El alquiler será abonado por adelantado del 1 al 5 de cada mes en el domicilio de la Locadora, siendo entendido que el mero vencimiento del plazo hará incurrir en mora de pleno derecho. El alquiler se pacta por períodos completos de mes entero. En caso de mora la Locadora podrá requerir el cobro de los alquileres adeudados con más un interés punitorio del 0,2% por cada día de demora. -</p>'
    +'<p><b>QUINTA</b>: La Locataria recibe el local de comercio desocupado y en perfecto estado de aseo y conservación, con todos sus vidrios, herrajes, llaves y demás accesorios obligándose a devolver el inmueble en las mismas condiciones. -</p>'
    +'<p><b>SEXTA</b>: La Locataria se obliga a no subarrendar en todo o en parte la propiedad; a no transferir, ni ceder, ni vender este contrato so pena de rescindirse el mismo. -</p>'
    +'<p><b>SÉPTIMA</b>: La Locataria ocupará la propiedad para <b>'+rubro+'</b> y no podrá cambiar su destino. Será por cuenta, cargo y riesgo exclusivo de la Locataria la obtención de las habilitaciones municipales para el funcionamiento del local. La Locadora autoriza a la Locataria la colocación de un cartel publicitario conforme las normas municipales vigentes. No podrá hacer modificaciones sin consentimiento previo escrito de la Locadora; las mejoras que efectuare quedarán a beneficio de la propiedad sin retribución alguna. -</p>'
    +'<p><b>OCTAVA</b>: Los gastos de AYSA, Alumbrado, Barrido y Limpieza y Luz durante el tiempo de ocupación serán por cuenta de la Locataria. La locataria se obliga a presentar los recibos originales a la Locadora una vez abonados. El servicio de luz corre por cuenta de la Locataria quien debe solicitarlos a su nombre desde el inicio del contrato. Serán por cuenta de la locataria la conservación de los artefactos y la reparación de los desperfectos menores provocados por el uso. -</p>'
    +'<p><b>NOVENA</b>: La locadora no se responsabiliza de los daños y perjuicios que pudiera producirle a la locataria o terceros, las inundaciones, filtraciones y desprendimientos provenientes de roturas o desperfectos de caños o techos o cualquier otro accidente producido en la propiedad. -</p>'
    +'<p><b>DECIMA</b>: La mora se pacta de pleno derecho y la falta de cumplimiento a cualquiera de las cláusulas del presente contrato, especialmente la falta de un solo mes de alquiler, facultará a la Locadora a rescindirlo y solicitar el desalojo con más la exigencia del pago de los alquileres y demás obligaciones dinerarias asumidas por la locataria hasta el mes en que se produzca la restitución material de la unidad.-</p>'
    +'<p><b>DECIMA PRIMERA</b>: En caso de consignación de las llaves, el alquiler regirá hasta el día en que la Locadora tome posesión real y efectiva de la propiedad, computándose siempre mes entero. -</p>'
    +'<p><b>DECIMA SEGUNDA</b>: Si la locataria diera motivo a que se iniciare juicio de desalojo, se obliga a pagar, desde la iniciación del juicio y hasta que la Locadora reciba las llaves, una suma igual al importe del doble del alquiler vigente. -</p>'
    +'<p><b>DECIMA TERCERA</b>: La entrega de las llaves de la propiedad deberá justificarla la Locataria con documento escrito emanado de la Locadora, no admitiéndose otro medio de prueba. -</p>'
    +(nGar?'<p><b>DECIMA CUARTA</b>: Presente en este acto <b>'+nGar+'</b> con DNI: '+(x.dniGarante||'__')+' con domicilio en la calle '+(x.domGarante||'__')+', se constituye en fiador liso, llano y principal pagador de todas y cada una de las obligaciones asumidas en el presente contrato. La presente garantía durará por toda la vigencia del contrato, de acuerdo a lo establecido en el art. 1582 bis de la Ley N° 25.628.'+(x.inmuebleGarante?' Los fiadores garantes declaran que el inmueble sito en <b>'+x.inmuebleGarante+'</b> es de su exclusiva propiedad, no está inscripto como bien de familia y no podrá ser inscripto como tal hasta la finalización de la presente garantía, comprometiéndose a no enajenarlo durante el período locativo.':'')+'</p>':'')
    +'<p><b>'+dJ+'</b>: Tanto los contratantes como los fiadores se someten para cualquier divergencia a la jurisdicción de los Tribunales Ordinarios de Capital Federal renunciando a todo otro fuero. Tanto la Locataria como los fiadores renuncian desde ya al derecho de recusar sin causa al magistrado en cualquier proceso derivado del presente. -</p>'
    +'<p><b>'+dK+'</b>: Al término del plazo contractual, la Locataria deberá entregar el inmueble sin demora. Si así no lo hiciere deberá abonar una multa igual al diez por ciento del alquiler vigente por cada día de demora en la entrega. Si una legislación futura posibilitara ampliar el término del contrato, la Locataria abonará el doble del alquiler correspondiente al último mes hasta que se produzca la entrega. -</p>'
    +'<p><b>'+dL+'</b>: La Locataria se obliga a suscribir ciento ochenta días antes de finalizado el plazo locativo un convenio de desocupación, obligándose a desocupar y entregar el bien locado en la fecha establecida en el presente. Si no firmara dicho convenio soportará la totalidad de las costas del desalojo anticipado que inicie la Locadora. -</p>'
    +'<p><b>'+dM+'</b>: La LOCATARIA tendrá a su cargo la contratación de seguros contra incendio, destrucción total o parcial, cristales, responsabilidad civil, robos y hurtos, quedando eximida la LOCADORA de responsabilidad al respecto. Tales pólizas serán endosadas a favor de la Locadora. -</p>'
    +'<p><b>'+dN+'</b>: El LOCATARIO hace entrega en este acto la suma de <b>'+dep+'</b>, en concepto de depósito en garantía por el fiel cumplimiento de todas y cada una de las obligaciones a su cargo. Esta suma se restituirá en la misma moneda sin intereses ni incrementos, previa las deducciones que correspondiesen, a los sesenta (60) días de recibido el inmueble de conformidad. El LOCATARIO no podrá compensar esta suma con alquileres a su cargo. -</p>'
    +'<p><b>'+dO+'</b>: <b>RESCISION ANTICIPADA:</b> Queda establecido entre las partes que el presente contrato de locación podrá ser rescindido a opción del LOCATARIO, una vez cumplidos los primeros SEIS (06) MESES de locación, debiendo notificar al LOCADOR su decisión con SESENTA (60) días de anticipación, mediante telegrama colacionado. Si hace uso de la opción resolutoria en el primer año de vigencia de la relación locativa, debe abonar al locador, en concepto de indemnización, la suma equivalente a un mes y medio de alquiler al momento de desocupar el inmueble y la de un mes si la opción se ejercita transcurrido dicho lapso, según el art. 1221 del Código Civil y Comercial.----------</p>'
    +'<p><b>'+dP+'</b>: Para todos los efectos legales que pudieran emerger de la aplicación de este contrato los firmantes constituyen los siguientes domicilios especiales: La Locadora en el ya estipulado, La Locataria en el inmueble locado sito en la calle <b>'+c.dir+'</b>, CABA.</p>'
    +'<p>En prueba de conformidad se firman dos (2) ejemplares de un mismo tenor y a un solo efecto, en la Ciudad de Buenos Aires, a los <b>'+dF+'</b> días del mes de <b>'+mF+'</b> de <b>'+aF+'</b>.-</p>';

  var firmas=locs.map(function(l){return{nombre:(l.nombre||'').toUpperCase(),rol:'LOCADOR'};});
  firmas.push({nombre:nInq,rol:'LOCATARIO'+(x.esEmpresa?' (Representante Legal)':'')});
  if(nGar)firmas.push({nombre:nGar,rol:'FIADOR GARANTE'});
  abrirVentana(body,firmas,'CONTRATO COMERCIAL — '+c.dir);
}

      +'<div><label style="font-size:12px;font-weight:500;display:block;margin-bottom:3px;">Domicilio Locador</label><input id="mc-domloc" style="width:100%;padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;" placeholder="Calle Nº, Ciudad"></div>'

      +'</div></div>';

    overlay.querySelector('[data-m="nuevo"]').onclick=function(){esModo='nuevo';render();};
    overlay.querySelector('[data-m="renovacion"]').onclick=function(){esModo='renovacion';render();};

<script>
(function(){

      +'<button id="rcan" style="background:#f3f4f6;color:#374151;border:1px solid #d1d5db;padding:8px 16px;border-radius:7px;font-size:13px;cursor:pointer;">Cancelar</button>'

function buildAvisos(){
  var content=document.querySelector('.content');
  if(!content||document.getElementById('nvp-ext-panel'))return;
  var contratos=getContratos(),ipc=getIPC(),cfg=getCfg();
  var conTel=contratos.filter(function(c){return c.tel;});
  var proxMes=new Date((new Date()).getFullYear(),(new Date()).getMonth()+1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'}).replace(/^\w/,function(c){return c.toUpperCase();});
  var panel=document.createElement('div');panel.id='nvp-ext-panel';panel.style.cssText='margin-bottom:16px;';
  panel.innerHTML='<div style="background:#1e1b4b;border-radius:10px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;">'
    +'<div><div style="color:#fff;font-weight:600;font-size:14px;">📱 Envío masivo — '+proxMes+'</div><div style="color:#a5b4fc;font-size:12px;margin-top:2px;">'+conTel.length+' con teléfono · '+(contratos.length-conTel.length)+' sin</div></div>'
    +'<button id="nvp-mass-btn" style="background:#7c3aed;color:#fff;border:none;padding:9px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;">📤 WA a todos ('+conTel.length+')</button>'
    +'</div><div id="nvp-mass-status" style="font-size:12px;color:#6b7280;min-height:16px;padding:0 4px;"></div>';
  content.insertBefore(panel,content.firstChild);
  var queue=[],qi=0;
  function sn(){
    if(qi>=queue.length){var st=document.getElementById('nvp-mass-status');if(st)st.textContent='✅ Listo.';var btn=document.getElementById('nvp-mass-btn');if(btn)btn.disabled=false;queue=[];qi=0;return;}
    var c=queue[qi];var a=proxAumento(c);var tA=a&&a.dias>=-5&&a.dias<=35;var alq=tA?nvC(c,ipc):c.valor;
    var mA=c.montoABL||0,mY=c.montoAYSA||0,mL=c.montoLuz||0,nA=c.nroABL||'',nY=c.nroAYSA||'',nL=c.nroLuz||'',ts=mA+mY+mL;
    var pm=new Date((new Date()).getFullYear(),(new Date()).getMonth()+1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
    function fm(v,m){return m==='USD'?'USD '+Number(v).toLocaleString('es-AR'):'$'+Number(v).toLocaleString('es-AR');}
    var L=['━━━━━━━━━━━━━━━━━━━━━━','📍 *Dirección:* '+c.dir,'📅 *Período:* '+pm,'','🏠 *Alquiler:* '+fm(alq,c.moneda)+(tA?' _(actualizado)_':'')];
    if(c.tipo!=='galeria'){L.push('');if(mL)L.push('💡 *Luz:* $'+mL.toLocaleString('es-AR')+(nL?'  _(N° '+nL+')_':''));else if(nL)L.push('💡 *Luz N° '+nL+'* _(pendiente)_');if(mY)L.push('💧 *AYSA:* $'+mY.toLocaleString('es-AR')+(nY?'  _(N° '+nY+')_':''));else if(nY)L.push('💧 *AYSA N° '+nY+'* _(pendiente)_');if(mA)L.push('🏛️ *ABL:* $'+mA.toLocaleString('es-AR')+(nA?'  _(N° '+nA+')_':''));else if(nA)L.push('🏛️ *ABL N° '+nA+'* _(pendiente)_');if(ts>0){L.push('');L.push('💰 *TOTAL:* '+(c.moneda==='ARS'?fm(alq+ts,'ARS'):'$'+ts.toLocaleString('es-AR')+' + '+fm(alq,'USD')));}}
    L.push('','━━━━━━━━━━━━━━━━━━━━━━','_'+(cfg.agencia||'Nicolás Ventura Propiedades')+'_','_Matrícula CUCICBA '+(cfg.matricula||'6811')+'_');
    var msg=L.join('\n');var tel=c.tel?'54'+c.tel.replace(/\D/g,''):'';
    window.open(tel?'https://wa.me/'+tel+'?text='+encodeURIComponent(msg):'https://wa.me/?text='+encodeURIComponent(msg),'_blank');
    var st=document.getElementById('nvp-mass-status');if(st)st.textContent='📤 '+(qi+1)+'/'+queue.length+': '+c.inquilino.split(',')[0];
    qi++;setTimeout(sn,2800);
  }
  document.getElementById('nvp-mass-btn').onclick=function(){if(!confirm('¿Abrir WhatsApp para '+conTel.length+' inquilinos?'))return;queue=conTel;qi=0;this.disabled=true;setTimeout(sn,400);};
}

var _lPg='';
setInterval(function(){
  var t=document.querySelector('.topbar-title');if(!t)return;var pg=t.textContent;
  if(pg!==_lPg){
    _lPg=pg;

    if(pg!=='Avisos fin de mes'){var ep=document.getElementById('nvp-ext-panel');if(ep)ep.remove();}
  }
  if(pg==='Contratos')inyectarRecibos();
},420);
})();

  var tipo=tipoTxt==='Dpto.'?'depto':tipoTxt==='Deposito'?'deposito':'local';
  if(!dir){alert('No se pudo detectar la direccion.');return;}
  if(!confirm('Mover "'+dir+'" a Propiedades Vacantes?'))return;
  var vacantes=[];
  try{vacantes=JSON.parse(localStorage.getItem('nvp_vacantes')||'[]');}catch{}
  if(vacantes.find(function(v){return v.dir===dir})){alert('Ya existe en propiedades vacantes.');return;}
  vacantes.push({id:'vac'+Date.now(),tipo:tipo,dir:dir,desc:'',precioUSD:0,precioARS:0,notas:'Disponible desde '+new Date().toLocaleDateString('es-AR'),disponibleDesde:new Date().toISOString().slice(0,10)});
  localStorage.setItem('nvp_vacantes',JSON.stringify(vacantes));
  alert('Agregada a Propiedades Vacantes. Completa precio y medidas en el menu.');
});
})();
</script>
</body>
</html>
